<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F5F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Memory Tale" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Dancing+Script:wght@600;700&family=Pacifico&family=Caveat:wght@500;700&family=Permanent+Marker&family=Bangers&family=Bebas+Neue&family=Poppins:wght@500;600;700&family=Special+Elite&family=Comic+Neue:wght@400;700&family=Patrick+Hand&family=Luckiest+Guy&family=Gochi+Hand&display=swap"
      rel="stylesheet"
    />
    <title>Memory Tale</title>
  </head>
  <body>
    <!-- shared smooth sticker outline (used by the cut-out editor preview) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="mt-outline" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="b" />
        <feComponentTransfer in="b" result="m"><feFuncA type="linear" slope="26" intercept="-1.05" /></feComponentTransfer>
        <feFlood flood-color="#ffffff" result="w" /><feComposite in="w" in2="m" operator="in" result="ring" />
        <feMerge><feMergeNode in="ring" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
